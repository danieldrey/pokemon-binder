<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>האלבום של דניאל · Next Pull IL</title>
  <meta name="description" content="האלבום הווירטואלי של דניאל — דפדוף בסטים.">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="view-album">
  <div class="grain" aria-hidden="true"></div>
  <header class="album-chrome">
    <div class="album-brand">
      <img class="logo sm" src="logo.png" alt="Next Pull IL">
      <div>
        <p class="eyebrow">Next Pull IL</p>
        <h1 id="title">האלבום של דניאל</h1>
      </div>
    </div>
    <div class="set-picker" id="setPicker" role="tablist" aria-label="בחירת סט"></div>
    <div class="album-status compact" id="albumStatus"></div>
  </header>

  <div class="book-wrap">
    <button type="button" class="book-nav prev" id="pagePrev" aria-label="העמוד הקודם">‹</button>
    <div class="binder-frame" id="binderFrame">
      <div class="binder-rings" id="binderRings" aria-hidden="true"></div>
      <div id="bookHost"><div id="book"></div></div>
    </div>
    <button type="button" class="book-nav next" id="pageNext" aria-label="העמוד הבא">›</button>
  </div>
  <div class="album-bottom">
    <div class="page-counter" id="pageCounter" aria-live="polite"></div>
    <button type="button" class="sound-toggle" id="soundToggle" aria-pressed="false">קול: כבוי</button>
  </div>

  <div id="focus" hidden>
    <div class="backdrop" id="focusBackdrop"></div>
    <div class="focus-panel" role="dialog" aria-modal="true" aria-labelledby="focusHeading">
      <button type="button" class="focus-x" id="focusClose" aria-label="סגירה">✕</button>
      <div class="persp"><div class="card big" id="bigCard"></div></div>
      <div class="focus-meta" id="focusMeta"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="vendor/page-flip.browser.js"></script>
  <script src="app.js"></script>
</body>
</html>
