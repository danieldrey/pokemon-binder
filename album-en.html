<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daniel’s Binder · Next Pull IL</title>
  <meta name="description" content="A shareable virtual binder you can flip through, set by set.">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="album-en.css">
</head>
<body class="album-en">
  <div class="room" aria-hidden="true"></div>

  <header class="hud">
    <div class="hud-brand">
      <img class="hud-logo" src="logo.png" alt="">
      <div>
        <p class="eyebrow">Next Pull IL</p>
        <h1>Daniel’s Binder</h1>
      </div>
    </div>
    <div class="hud-meta" id="hudMeta"></div>
    <button type="button" class="hud-btn" id="contentsBtn" aria-expanded="false">Contents</button>
  </header>

  <main class="stage">
    <button type="button" class="nav prev" id="pagePrev" aria-label="Previous page">‹</button>
    <div class="binder" id="binderFrame">
      <div class="rings" id="binderRings" aria-hidden="true"></div>
      <div class="spine" id="binderSpine" aria-hidden="true"></div>
      <div id="bookHost"><div id="book"></div></div>
    </div>
    <button type="button" class="nav next" id="pageNext" aria-label="Next page">›</button>
  </main>

  <footer class="dock">
    <button type="button" class="dock-nav" id="dockPrev" aria-label="Previous page">‹</button>
    <div class="dock-status" id="pageCounter" aria-live="polite"></div>
    <button type="button" class="dock-nav" id="dockNext" aria-label="Next page">›</button>
    <button type="button" class="hud-btn quiet" id="soundToggle" aria-pressed="false">Sound: Off</button>
  </footer>

  <aside id="toc" class="toc" hidden>
    <div class="toc-panel" role="dialog" aria-labelledby="tocHeading">
      <div class="toc-head">
        <h2 id="tocHeading">Jump to a set</h2>
        <button type="button" class="focus-x small" id="tocClose" aria-label="Close contents">✕</button>
      </div>
      <div id="tocList"></div>
    </div>
    <button type="button" class="toc-backdrop" id="tocBackdrop" aria-label="Close contents"></button>
  </aside>

  <div id="focus" hidden>
    <div class="backdrop" id="focusBackdrop"></div>
    <div class="focus-panel" role="dialog" aria-modal="true" aria-labelledby="focusHeading">
      <button type="button" class="focus-x" id="focusClose" aria-label="Close">✕</button>
      <div class="persp"><div class="card big" id="bigCard"></div></div>
      <div class="focus-meta" id="focusMeta"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="vendor/page-flip.browser.js"></script>
  <script src="album-en.js"></script>
</body>
</html>
